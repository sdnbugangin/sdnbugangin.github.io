<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#d71920">
<meta name="description" content="Daftar prestasi siswa SD N BUGANGIN, Kecamatan Kendal, Kabupaten Kendal.">
<title>Prestasi Siswa | SD N BUGANGIN</title>
<link rel="icon" type="image/png" href="../logo.png">
<link rel="stylesheet" href="prestasi.css">
<style>
:root{--red:#d71920;--red-dark:#9e1117;--yellow:#ffd21f;--blue:#12314f;--cream:#fffaf0;--ink:#16202a;--muted:#64748b;--line:#e9dfc8}
*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
.topline{height:6px;background:linear-gradient(90deg,var(--red) 0 42%,var(--yellow) 42% 68%,var(--blue) 68%)}
.wrap{max-width:1080px;margin:auto;padding:22px}.back{color:var(--blue);text-decoration:none;font-weight:800;font-size:14px}.back:hover{color:var(--red)}
header{margin-top:18px;padding:28px;border-radius:26px;background:linear-gradient(135deg,var(--red),var(--blue));color:#fff;display:flex;align-items:center;gap:20px;box-shadow:0 16px 34px rgba(18,49,79,.13)}
header img{width:84px;height:84px;object-fit:contain;background:#fff;border-radius:18px;padding:7px;flex:none}h1{margin:0 0 6px;font-size:clamp(1.7rem,4vw,2.8rem);letter-spacing:-.04em}header p{margin:0;color:#ffecef;line-height:1.5}
.tools{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;margin:22px 0 16px}
.pills{display:flex;gap:6px;flex-wrap:wrap}.pill{border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 14px;font:inherit;font-size:13.5px;font-weight:700;cursor:pointer;color:var(--blue)}.pill.on{background:var(--yellow);border-color:var(--yellow);color:var(--ink)}
select{font:inherit;font-size:14px;padding:9px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink)}
.status{color:var(--muted);text-align:center;padding:40px 10px;font-size:15px}
footer{text-align:center;color:var(--muted);font-size:13px;line-height:1.7;padding:30px 20px 8px}
@media(max-width:600px){.wrap{padding:16px}header{padding:20px;gap:14px}header img{width:60px;height:60px}}
</style>
</head>
<body>
<div class="topline"></div>
<div class="wrap">
  <a class="back" href="../">&larr; Kembali ke Beranda</a>
  <header><img src="../logo.png" alt="Logo SD N BUGANGIN"><div><h1>Prestasi Siswa</h1><p>Kebanggaan warga SD N BUGANGIN. Terima kasih untuk siswa, guru pembimbing, dan orang tua.</p></div></header>
  <div class="tools">
    <div class="pills" id="tahun" aria-label="Pilih tahun"></div>
    <label><span style="position:absolute;left:-9999px">Tingkat</span><select id="tingkat"><option value="">Semua tingkat</option></select></label>
  </div>
  <p class="prestasi-ringkas" id="ringkas" style="margin-bottom:14px"></p>
  <div class="prestasi-grid" id="grid"></div>
  <div class="status" id="status">Memuat daftar prestasi&hellip;</div>
  <footer><strong>SD N BUGANGIN</strong><br>Sehat &middot; Unggul &middot; Patriotis &middot; Etis &middot; Religius</footer>
</div>
<script src="prestasi.js"></script>
<script>
var SEMUA = [], TAHUN = '';
var $ = function (s) { return document.querySelector(s); };
Prestasi.TINGKAT.forEach(function (t) { $('#tingkat').insertAdjacentHTML('beforeend', '<option>' + t + '</option>'); });
function render() {
  var tahunList = Array.from(new Set(SEMUA.map(function (p) { return p.tanggal.slice(0, 4); }))).sort().reverse();
  if (TAHUN && tahunList.indexOf(TAHUN) < 0) TAHUN = '';
  $('#tahun').innerHTML = ['', ...tahunList].map(function (t) { return '<button class="pill' + (t === TAHUN ? ' on' : '') + '" data-t="' + t + '">' + (t || 'Semua tahun') + '</button>'; }).join('');
  var tk = $('#tingkat').value;
  var list = SEMUA.filter(function (p) { return (!TAHUN || p.tanggal.indexOf(TAHUN) === 0) && (!tk || p.tingkat === tk); });
  $('#grid').innerHTML = list.map(Prestasi.kartu).join('');
  $('#ringkas').innerHTML = list.length ? '<b>' + list.length + ' prestasi</b>' + (TAHUN ? ' di tahun ' + TAHUN : '') + (tk ? ' tingkat ' + tk : '') : '';
  $('#status').textContent = SEMUA.length ? (list.length ? '' : 'Tidak ada prestasi untuk pilihan ini.') : 'Belum ada prestasi yang diumumkan.';
}
$('#tahun').addEventListener('click', function (e) { var b = e.target.closest('[data-t]'); if (b) { TAHUN = b.dataset.t; render(); } });
$('#tingkat').addEventListener('change', render);
Prestasi.ambil(function (list) { SEMUA = list; render(); });
setTimeout(function () { if (!SEMUA.length && /Memuat/.test($('#status').textContent)) $('#status').textContent = 'Daftar prestasi belum dapat dimuat. Periksa koneksi, lalu muat ulang halaman.'; }, 12000);
</script>
</body>
</html>
